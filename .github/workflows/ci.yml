name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  # Las pruebas no tocan los CSV del SRI (535 MB en LFS), así que ningún job
  # necesita descargarlos.
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .

  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  docs:
    name: Documentación sin referencias muertas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra docs
      # --strict falla ante cualquier enlace roto o página fuera del nav. Es lo
      # que impide que la documentación vuelva a describir un repositorio que ya
      # no existe: antes eso solo se detectaba leyendo.
      - run: uv run mkdocs build --strict
      # La tabla comparativa se genera desde los JSON medidos. Se escribía a
      # mano, y por eso publicó durante meses las cifras de un protocolo que el
      # código ya no usaba.
      - name: la tabla publicada coincide con las métricas medidas
        run: uv run python scripts/report_model_table.py --check

  lock:
    name: uv.lock al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check
