# Instalar:  uv run pre-commit install   (o `just setup`)
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      # Los modelos y CSV grandes deben ir por Git LFS, no como blobs.
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      # El guard que ya existía en .githooks/ pero que exigía un `ln -sf` manual
      # que nadie ejecutaba. Así se activa solo. Ver docs/git_lfs.md.
      - id: lfs-pointer-guard
        name: los CSV del SRI deben pasar por Git LFS
        entry: .githooks/pre-commit
        language: script
        pass_filenames: false
        always_run: true
