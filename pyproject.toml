[project]
name = "vehicles"
version = "0.1.0"
description = "Planificación automatizada de distribución de vehículos en camiones de carga"
requires-python = ">=3.12,<3.13"

# Pinned because the report (Sec. VI) claims specific versions and because
# TensorFlow 2.21 -- the Keras 3 backend -- only publishes wheels up to
# CPython 3.13. The system interpreter here is 3.14, on which `pip install
# tensorflow` fails outright. See docs/decisiones/01_hallazgos_transversales.md.
dependencies = [
    "keras>=3.15,<3.16",
    "tensorflow>=2.21,<2.22",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "pyyaml>=6",
    "openpyxl>=3.1",
    # mlflow y optuna son core, no extras: los usan tanto el pipeline Kedro
    # (`nodes.py`, `attention_model.py`) como `scripts/train_classical.py`, y
    # todo entrenamiento de este repositorio deja traza en MLflow. Estuvieron un
    # momento declarados a la vez aquí y como extra `tracking`; el merge no
    # marcó conflicto porque eran secciones distintas del archivo.
    "mlflow>=3.14,<4",
    "optuna>=4.1,<5",
]

# Extras opcionales. Antes de esto, xgboost, lightgbm, torch, kedro y mkdocs se
# importaban en el código pero no estaban declarados en NINGÚN manifiesto (ni
# aquí, ni en requirements.txt, ni en fleet_loading/), así que `kedro run` y
# `mkdocs serve` --los dos comandos del quick start-- fallaban en un clon
# limpio. Van como extras para no obligar a instalar TensorFlow *y* PyTorch *y*
# los GBT a quien solo use uno.
[project.optional-dependencies]
gbt = [
    "xgboost>=2.1,<4",
    "lightgbm>=4.5,<5",
]
attention = [
    "torch>=2.4,<3",
]
kedro = [
    "kedro>=1.5,<2",
    "kedro-datasets[matplotlib,pandas]>=5",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.16,<0.17",
    "pre-commit>=4,<5",
]

[tool.uv]
# Scripts add the repo root to sys.path (see scripts/build_scenarios.py); there
# is nothing to build or install as a distribution.
package = false

# El transformer se entrena en CPU (batch 128, 50 épocas, ~35 k episodios). Sin
# fijar el índice, `torch` arrastra las ruedas de CUDA de NVIDIA: varios GB que
# esta máquina no puede usar --lleva gráficos AMD-- y que en CI serían minutos de
# descarga en cada ejecución.
#
# Si alguien del equipo entrena en una GPU NVIDIA, basta con borrar estos dos
# bloques; el resto del manifiesto no cambia.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

# Árbol heredado pendiente de limpiar. Se reduce por etapas: al dejar un
# directorio en verde se quita de esta lista y no vuelve a entrar.
#
# Queda **una sola** entrada. `scripts/reporting` concentra los 329 errores
# restantes, y sanearlo no es solo linting: buena parte desaparece al borrar el
# árbol muerto de plotting, y borrarlo exige poder regenerar las figuras para
# demostrar por comparación de píxeles que ninguna cambia. Eso está bloqueado
# por `data/raw/SRI_Vehiculos_DD.xlsx`, que está en .gitignore y no viene en el
# clon.
#
# Ya saneados y fuera de la lista: fleet_loading (31), src/profiler (81),
# scripts/loading (21), scripts/profiling (14), scripts/build_*.py (21),
# src/pipeline (5), scripts/run_*.py (5), src/loading (2).
extend-exclude = [
    "scripts/reporting",
]

[tool.ruff.format]
# Ruff >=0.16 también formatea los bloques de código Python embebidos en
# Markdown. Aquí eso es dañino: `chat/` son transcripciones de sesiones de IA
# que se entregan como evidencia del curso y no deben reescribirse, y los
# ejemplos de docs/ usan alineación deliberada con fines pedagógicos.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
