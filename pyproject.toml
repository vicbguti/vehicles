[project]
name = "vehicles"
version = "0.1.0"
description = "Planificación automatizada de distribución de vehículos en camiones de carga"
requires-python = ">=3.12,<3.13"

# Pinned because the report (Sec. VI) claims specific versions and because
# TensorFlow 2.21 -- the Keras 3 backend -- only publishes wheels up to
# CPython 3.13. The system interpreter here is 3.14, on which `pip install
# tensorflow` fails outright. See docs/tarea4/05_hallazgos_para_el_equipo.md.
dependencies = [
    "keras>=3.15,<3.16",
    "tensorflow>=2.21,<2.22",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "pyyaml>=6",
    "openpyxl>=3.1",
]

# El sitio MkDocs se declaraba en ninguna parte pese a que docs/index.md manda
# ejecutar `mkdocs serve`. Como extra opcional no lastra el entorno de trabajo.
[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pymdown-extensions>=10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.16,<0.17",
    "pre-commit>=4,<5",
]

[tool.uv]
# Scripts add the repo root to sys.path (see scripts/build_scenarios.py); there
# is nothing to build or install as a distribution.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

# El árbol heredado (scripts/reporting, src/profiler, fleet_loading, notebooks) acumula
# ~514 violaciones anteriores a este linter. Excluirlas es lo que hace que `ruff check .`
# sea utilizable: sin esto el comando falla siempre y nadie lo corre. Limpiarlas es un
# trabajo aparte -- al hacerlo, quitar la ruta de esta lista.
extend-exclude = [
    "scripts/reporting",
    "scripts/profiling",
    "scripts/loading",
    "scripts/run_pipeline.py",
    "scripts/run_profiling.py",
    "scripts/run_reporting.py",
    "scripts/build_scenarios.py",
    "scripts/build_vehicle_features.py",
    "src/profiler",
    "src/pipeline",
    "src/data_dictionary.py",
    "src/loading",
    "fleet_loading",
    "notebooks",
]

[tool.ruff.format]
# Ruff >=0.16 también formatea los bloques de código Python embebidos en
# Markdown. Aquí eso es dañino: `chat/` son transcripciones de sesiones de IA
# que se entregan como evidencia del curso y no deben reescribirse, y los
# ejemplos de docs/ usan alineación deliberada con fines pedagógicos.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
